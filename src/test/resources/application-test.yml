# application-test.yml - ПРАВИЛЬНЫЙ ВАРИАНТ
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop  # для тестов лучше create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Отключаем security для тестов
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.SecurityFilterAutoConfiguration

  sql:
    init:
      mode: always

# JWT настройки для тестов
app:
  secretKeySalt: test_salt_for_tests_only
  jwtSecretKey: test_jwt_secret_key_for_tests_only_12345
  current:
    version: 1.0-test
  download:
    url: http://localhost:8080/test

# Логирование для тестов
logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.test.context: INFO
    org.springframework.transaction: INFO
    com.zaxxer.hikari: INFO